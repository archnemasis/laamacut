appId: com.laamacut.desktop
productName: Laamacut
# Predictable, space-free, arch-suffixed names → clean R2 URLs + a simple
# manifest (e.g. Laamacut-1.2.3-arm64.dmg, Laamacut-1.2.3-x64.exe).
artifactName: ${productName}-${version}-${arch}.${ext}
asar: true
directories:
  output: release
# Updates come from Laamacut's GitHub releases. Build with --publish never and
# upload the installer, its .blockmap and latest.yml to the release.
publish:
  provider: github
  owner: archnemasis
  repo: laamacut
files:
  - dist/**/*
  - "!**/*.map"
  - package.json
extraResources:
  - from: ../web/dist
    to: renderer
    filter:
      - "**/*"
  - from: resources/bin
    to: bin
    filter:
      - "**/*"
  - from: resources/aurora
    to: aurora
    filter:
      - "**/*"
  - from: LICENSES
    to: LICENSES
    filter:
      - "**/*"
mac:
  category: public.app-category.video
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Laamacut has no Apple Developer ID yet, so Mac builds are unsigned.
  identity: null
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
linux:
  icon: build/icon.png
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: AudioVideo
