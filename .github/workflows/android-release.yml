name: Android release

# Builds the signed Laamacut APK from a clean checkout and attaches it to the
# release, so no APK is ever built or uploaded by hand.
#
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64    the release keystore, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD  its store password
#   ANDROID_KEY_ALIAS          the key alias
#   ANDROID_KEY_PASSWORD       the key password
# Without them the APK is built unsigned and only kept as a workflow artifact.

on:
  push:
    tags: ["laamacut-*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The full build compiles the WASM modules first (audio analysis, WAV,
      # beat detection); building only the web app would skip them.
      - name: Build the web app and WASM modules
        run: pnpm build

      - name: Check the WASM modules were built
        run: |
          for module in fft/build/fft wav/build/wav beat-detection/build/beat; do
            test -s "packages/core/src/wasm/$module.wasm" || { echo "Missing $module.wasm"; exit 1; }
          done

      # Auto captions must work on first use and offline, so the model is
      # built into the APK rather than downloaded by the app.
      - name: Bundle the auto-captions model
        run: |
          node apps/android/scripts/fetch-caption-model.mjs
          models=apps/android/android/app/src/models/public/models
          for file in onnx-community/whisper-tiny/config.json \
                      onnx-community/whisper-tiny/onnx/encoder_model_quantized.onnx \
                      onnx-community/whisper-tiny/onnx/decoder_model_merged_quantized.onnx \
                      ort/ort-wasm-simd-threaded.jsep.wasm; do
            test -s "$models/$file" || { echo "Missing $file"; exit 1; }
          done

      - name: Sync into the Android project
        working-directory: apps/android
        run: pnpm exec cap sync android

      - name: Set up release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing secrets: building unsigned."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > apps/android/android/release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > apps/android/android/keystore.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build the APK
        working-directory: apps/android/android
        run: ./gradlew assembleRelease -q

      - name: Name the APK
        id: apk
        run: |
          VERSION=$(node -p "require('./apps/android/package.json').version")
          SUFFIX=""
          [ "${{ steps.signing.outputs.signed }}" = "true" ] || SUFFIX="-unsigned"
          SRC=$(ls apps/android/android/app/build/outputs/apk/release/*.apk | head -1)
          cp "$SRC" "Laamacut-$VERSION$SUFFIX.apk"
          sha256sum "Laamacut-$VERSION$SUFFIX.apk" > "Laamacut-$VERSION$SUFFIX.apk.sha256"
          cat "Laamacut-$VERSION$SUFFIX.apk.sha256"
          echo "file=Laamacut-$VERSION$SUFFIX.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.file }}.sha256

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/laamacut-') && steps.signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" "${{ steps.apk.outputs.file }}" "${{ steps.apk.outputs.file }}.sha256" --clobber
